<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpure SDN.BHD.</title>

    <!--outsourcing-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />


    <style>
        * {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            outline: none;
            border: none;
            text-transform: capitalize;
            transition: all .2s linear;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            background-repeat: no-repeat;
            background-attachment: fixed;

        }

        body {
            background-color: #eee;
            background-position-x: 0;
            background-position-Y: 0;
            background-attachment: fixed;
            padding-top: 50px;
            padding-bottom: 0px;
            margin-bottom: 0px;

        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #A652FA;
            padding: 1rem 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: var(--box-shadow);
        }

        .logoSaya {
            width: 120px;
            cursor: pointer;
            transition: transform 0.5s;
            margin-right: 10px;

        }

        .logoSaya:hover {
            transform: translateY(-10px);
        }

        header .logo {
            color: var(--black);
            font-size: 1.5rem;
            font-weight: bolder;
            margin-right: 400px;
        }

        header .logo i {
            color: var(--brown);
        }

        header .navbar a {
            font-size: 1.2rem;
            border-radius: .5rem;
            padding: .5rem 1.5rem;
            color: var(--black);
        }

        header .navbar a.active,
        header .navbar a:hover {
            color: #fff;
            background: var(--brown);
        }

        header .icons i,
        header .icons a {
            cursor: pointer;
            margin-left: .5rem;
            height: 4.5rem;
            line-height: 4.5rem;
            width: 4.5rem;
            text-align: center;
            font-size: 1.2rem;
            color: var(--black);
            border-radius: 80%;
            background: #eee;
        }

        header .icons i:hover,
        header .icons a:hover {
            color: #fff;
            background: var(--brown);
            transform: rotate(360deg);
        }
        #menu-bars {
            background-color: #A652FA;
            color: var(--black);
            padding: 8px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12%;
            cursor: pointer;
            margin-left: 40px;

        }

        #menu-bars:hover {
            color: white;
        }

        .icone {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        .dropdown-content2 {
            display: none;
            position: absolute;
            background-color: #f1f1f1;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content2 a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 1.2rem;
        }

        .dropdown-content2 a:hover {
            background-color: #ddd;
        }

        .icone:hover .dropdown-content2 {
            display: block;
        }

        .icone:hover #menu-bars {
            background-color: var(--brown);
        }

        .home {
            min-height: 110vh;
            display: flex;
            align-items: center;
            background: url(images/backgroundbus2.jpg) no-repeat;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #div1 {
            background-color: #FFDFDF;
            height: 20px;
        }

        #div2 {
            height: 100px;
        }

        #div2 img {
            margin-top: -65px;
            margin-left: 370px;
        }

        .swiper {
            width: 800px;
            height: fit-content;
            padding-top: 70px;
            margin-top: -500px;
            margin-left: 280px;

        }

        .swiper-slide img {
            width: 100%;
        }

        .search-form {
            height: 360px;
            width: 400px;
            margin-top: 110%;
            margin-left: -150%;
            margin-bottom: 50%;
            color: black;
            background-color: rgba(240, 237, 237, 0.8);
        }

        .search-head {
            padding: 8px;

        }

        .search-content .radio {
            margin: 10px 10px;

        }

        .search-content2 .input {
            width: 300px;
            padding: 10px;
            margin: 10px;
            color: black;
        }

        .search-content2 .tarikh {
            margin: 10px;
            padding: 10px;
            color: #fff;
        }

        .btnShow button{
           
            width: 100px;
            height: 40px;
            cursor: pointer;
            font-size: 16px;
            background-color: #FE6969;
            border-radius: 5%;
            transition: transform 0.5s;
        }
        .btnShow button:hover{
            background-color: white;
            transform: translateX(10px);
        }
    </style>

<body>
    <header>
        <img src="images/logoInterpure.png" alt="Interpure" class="logoSaya">
        <a href="#" class="logo"><i class="fas-fa-utensils"></i>INTERPURE</a>

        <nav class="navbar">
            <a class="active" href="homepage.html">Home</a>

            <a href="aboutUs.html">About</a>
            <a href="contactUs.html">Contact Us</a>
        </nav>
        <div class="icone">
            <i class="fas fa-bars" id="menu-bars"></i>
            <div class="dropdown-content2">
                <a href="index.html">Log Out</a>
            </div>
        </div>
        
    </header>

    <div id="div1"></div>
    <div id="div2">
        <img src="images/choiceIsYours.png">
    </div>

    <section class="home" id="home">
        <div class="homeContent">
            <div class="container">
                <div class="swiper">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide"><img src="images/posterBus4.png" width="1080" height="350">></div>
                        <div class="swiper-slide"><img src="images/posterBus3.png" width="1080" height="350"></div>
                        <div class="swiper-slide"><img src="images/posterBus2.png" width="1080" height="350"></div>
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
        </div>

        <br>

        <form action="chooseTicket.html">
            <div class="search-form bg-white">
                <div class="seacrh-head bg-warning">
                    <h1 align="center">Reserve your Ticket</h1>
                </div>

                <div align="center" class="search-content">
                    <input type="radio" class="radio" name="r">
                    <label class="text-white">One Way:</label>
                    <input type="radio" class="radio" name="r">
                    <label class="text-white">Return date:</label>
                </div>

                <div align="center" class="search-content2">
                    <input type="text" placeholder="From" class="input bg-dark" style="border: 1px solid black"
                        required>
                    <input type="text" placeholder="To" class="input bg-dark" style="border: 1px solid black" required>
                </div>

                <br>

                <div align="center">
                    <label class="text-white" style="margin-left:10px;">Depart:</label>
                    <input type="date" class="tarikh bg-white">
                    <br>
                    <br>
                    <label class="text-white" style="margin-left:10px;">Return date:</label>
                    <input type="date" class="tarikh bg-white">
                    <br>
                    <br>
                </div>

                <div class="btnShow" align="center">
                    <button onClick="getDate()">Search</button>
                </div>

            </div>
        </div>
     </form>
</section>


    <!--slider content-->

    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

    <script>
        const swiper = new Swiper('.swiper', {

            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },
            loop: true,

            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },

            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },

        });
    </script>

    <script src="script.js"></script>
</body>
</head>

</html>

</html>
